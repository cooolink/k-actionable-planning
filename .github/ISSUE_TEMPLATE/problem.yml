name: 问题反馈或改进建议
description: 提供具体请求与期望结果，帮助定位规则或文档问题。
body:
  - type: textarea
    id: context
    attributes:
      label: 使用场景与请求
      description: 请删除个人信息和敏感资料。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际表现或存在的问题
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果或修改建议
    validations:
      required: true
